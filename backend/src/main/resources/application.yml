spring:
  application:
    name: flowcrm

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/flowcrm}
    username: ${DB_USERNAME:flowcrm}
    password: ${DB_PASSWORD:flowcrm}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:flowcrm}
    password: ${RABBITMQ_PASSWORD:flowcrm}

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # Override JWT_SECRET in real environments; local default is for hackathon only.
    secret: ${JWT_SECRET:LocalDevOnlySecretKeyThatIsAtLeast32BytesLong!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  messaging:
    # Set false for local runs without RabbitMQ / for unit-style tests.
    enabled: ${MESSAGING_ENABLED:true}

  outbox:
    publisher:
      enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
      poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
      batch-size: ${OUTBOX_BATCH_SIZE:50}

  reminders:
    # Dev/test hook: when true, ReminderDeliveryService throws to exercise retry/DLQ.
    fail-delivery: ${REMINDERS_FAIL_DELIVERY:false}
    max-attempts: ${REMINDERS_MAX_ATTEMPTS:3}
    retry-delay-ms: ${REMINDERS_RETRY_DELAY_MS:5000}

logging:
  level:
    org.springframework.security: INFO
    com.flowcrm.reminder: INFO
    com.flowcrm.outbox: INFO
