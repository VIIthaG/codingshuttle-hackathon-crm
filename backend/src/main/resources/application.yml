spring:
  application:
    name: flowcrm

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/flowcrm}
    username: ${DB_USERNAME:flowcrm}
    password: ${DB_PASSWORD:flowcrm}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # Override JWT_SECRET in real environments; local default is for hackathon only.
    secret: ${JWT_SECRET:LocalDevOnlySecretKeyThatIsAtLeast32BytesLong!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    org.springframework.security: INFO
