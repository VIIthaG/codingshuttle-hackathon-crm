spring:
  application:
    name: flowcrm

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/flowcrm}
    username: ${DB_USERNAME:flowcrm}
    password: ${DB_PASSWORD:flowcrm}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:flowcrm}
    password: ${RABBITMQ_PASSWORD:flowcrm}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL:false}

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      ssl:
        enabled: ${REDIS_SSL:false}
      repositories:
        # This project uses RedisTemplate/cache/locks only — not Spring Data Redis repositories.
        enabled: false

  cache:
    type: ${CACHE_TYPE:redis}

# Railway injects PORT. Prefer PORT, then SERVER_PORT, then local default 8080.
server:
  port: ${PORT:${SERVER_PORT:8080}}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    try-it-out-enabled: true

app:
  jwt:
    # Local fallback is for hackathon/dev only. Set JWT_SECRET in every shared/hosted environment.
    secret: ${JWT_SECRET:LocalDevOnlySecretKeyThatIsAtLeast32BytesLong!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  cors:
    # Comma-separated browser origins. Production example: https://flowcrm.up.railway.app
    # Never use * for hosted environments.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  messaging:
    # Set false for local runs without RabbitMQ / for unit-style tests.
    enabled: ${MESSAGING_ENABLED:true}

  outbox:
    publisher:
      enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
      poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
      batch-size: ${OUTBOX_BATCH_SIZE:50}

  reminders:
    # Dev/test hook: when true, ReminderDeliveryService throws to exercise retry/DLQ.
    fail-delivery: ${REMINDERS_FAIL_DELIVERY:false}
    max-attempts: ${REMINDERS_MAX_ATTEMPTS:3}
    retry-delay-ms: ${REMINDERS_RETRY_DELAY_MS:5000}

  cache:
    dashboard-ttl-seconds: ${DASHBOARD_CACHE_TTL_SECONDS:60}

  rate-limit:
    login:
      enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
      max-requests: ${LOGIN_RATE_LIMIT_MAX:10}
      window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
      fail-open: ${LOGIN_RATE_LIMIT_FAIL_OPEN:true}

  locks:
    outbox:
      enabled: ${OUTBOX_LOCK_ENABLED:true}
      key: ${OUTBOX_LOCK_KEY:lock:flowcrm:outbox-publisher}
      ttl-seconds: ${OUTBOX_LOCK_TTL_SECONDS:30}

  ai:
    enabled: ${FLOW_AI_ENABLED:false}
    api-key: ${FLOW_AI_API_KEY:}
    base-url: ${FLOW_AI_BASE_URL:https://api.openai.com/v1}
    model: ${FLOW_AI_MODEL:gpt-4o-mini}
    timeout-seconds: ${FLOW_AI_TIMEOUT_SECONDS:20}
    max-output-tokens: ${FLOW_AI_MAX_OUTPUT_TOKENS:1000}

logging:
  level:
    org.springframework.security: INFO
    com.flowcrm.reminder: INFO
    com.flowcrm.outbox: INFO
    com.flowcrm.dashboard: INFO
    com.flowcrm.ratelimit: INFO
    com.flowcrm.lock: INFO
    com.flowcrm.assistant: INFO
