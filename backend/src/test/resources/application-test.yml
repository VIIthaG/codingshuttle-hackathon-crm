spring:
  datasource:
    url: jdbc:h2:mem:flowcrm;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

app:
  jwt:
    secret: TestOnlyJwtSecretKeyThatIsLongEnoughForHs256Algorithms!
    expiration-ms: 3600000
  messaging:
    enabled: false
  outbox:
    publisher:
      enabled: false
  reminders:
    fail-delivery: false
    max-attempts: 3
    retry-delay-ms: 100
