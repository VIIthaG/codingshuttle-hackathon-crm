spring:
  datasource:
    url: jdbc:h2:mem:flowcrm;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  data:
    redis:
      repositories:
        enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  cache:
    type: simple

app:
  jwt:
    secret: TestOnlyJwtSecretKeyThatIsLongEnoughForHs256Algorithms!
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173
  messaging:
    enabled: false
  outbox:
    publisher:
      enabled: false
  reminders:
    fail-delivery: false
    max-attempts: 3
    retry-delay-ms: 100
  cache:
    dashboard-ttl-seconds: 60
  rate-limit:
    login:
      enabled: false
      max-requests: 10
      window-seconds: 60
      fail-open: true
  locks:
    outbox:
      enabled: false
      key: lock:flowcrm:outbox-publisher
      ttl-seconds: 30
  ai:
    enabled: false
    api-key:
    base-url: https://api.openai.com/v1
    model: gpt-4o-mini
    timeout-seconds: 5
    max-output-tokens: 200
